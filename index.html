<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dorlion Koro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{--bg:#2340E0;--navy:#101A6B;--cream:#FFF1D6;--pink:#FF3D7F;--sun:#FFD42A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B33BD;--navy:#0B1255;--cream:#FFF1D6;--pink:#FF3D7F;--sun:#FFD42A}}
:root[data-theme="dark"]{--bg:#1B33BD;--navy:#0B1255;--cream:#FFF1D6;--pink:#FF3D7F;--sun:#FFD42A}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--navy);font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.hero{position:relative}
h1{position:absolute;left:5%;top:3.5%;margin:0;padding:.35em .55em;background:var(--cream);color:var(--navy);box-shadow:7px 7px 0 var(--pink);transform:rotate(-2deg);font-size:clamp(34px,10.5vw,54px);line-height:1;font-weight:800;letter-spacing:-.03em}
.badge{position:absolute;right:5%;top:20%;width:clamp(88px,25vw,118px);aspect-ratio:1;border-radius:50%;background:var(--sun);color:var(--navy);transform:rotate(12deg);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(11px,3.3vw,14px);line-height:1.1;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.card{position:relative;margin:-26% 5% 0;background:var(--cream);border-radius:18px;padding:24px 22px 22px;box-shadow:9px 9px 0 var(--pink);transform:rotate(-1deg)}
.lab{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.time{margin:2px 0 0;font-size:clamp(34px,10vw,46px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.place{margin:6px 0 0;font-size:clamp(22px,6.5vw,30px);font-weight:800;line-height:1.1}
.btns{display:grid;gap:12px;margin:22px 5% 0;padding-bottom:36px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:18px;padding:16px;border-radius:14px;letter-spacing:.01em}
.b1{background:var(--navy);color:var(--cream)}
.b2{background:var(--pink);color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<svg viewBox="0 0 640 900" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Başları hafifçe geriye atılmış, yüzsüz ve şık beş koro silueti; arkada dev güneş, ses halkaları ve notalar" style="display:block;width:100%;height:auto">
<defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
<feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.2  -2.2 0 0 0 1.0"/>
</filter>
<pattern id="dotsPink" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="6" cy="6" r="3.6" fill="#FF3D7F"/></pattern>
<pattern id="dotsCream" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="5" cy="5" r="2.3" fill="#FFF1D6"/></pattern>
<clipPath id="sun"><circle cx="320" cy="380" r="205"/></clipPath>
<g id="body"><path d="M-84 300 L-80 86 C-78 40 -44 22 -15 10 L15 10 C44 22 78 40 80 86 L84 300 Z"/></g>
<g id="neck"><path d="M-15 16 L-12 -72 L12 -72 L15 16 Z"/></g>
<g id="head"><ellipse cx="0" cy="-118" rx="38" ry="50"/></g>
<g id="bn">
<ellipse cx="0" cy="0" rx="48" ry="35"/><ellipse cx="190" cy="-26" rx="48" ry="35"/>
<rect x="36" y="-300" width="15" height="300"/><rect x="226" y="-326" width="15" height="300"/>
<polygon points="36,-300 241,-352 241,-296 36,-244"/>
</g>
<g id="qn">
<ellipse cx="0" cy="0" rx="42" ry="30"/><rect x="30" y="-210" width="13" height="210"/>
<path d="M43 -210 C 90 -190, 96 -140, 74 -104 C 80 -146, 66 -168, 43 -172 Z"/>
</g>
</defs>

<g filter="url(#rough)">
<!-- sound rings -->
<g fill="none" stroke-width="24">
<circle cx="320" cy="380" r="255" stroke="#FF3D7F"/>
<circle cx="320" cy="380" r="310" stroke="#FFF1D6"/>
<circle cx="320" cy="380" r="365" stroke="#FF3D7F"/>
<circle cx="320" cy="380" r="420" stroke="#FFD42A"/>
</g>
<circle cx="36" cy="520" r="90" fill="url(#dotsCream)"/>
<circle cx="615" cy="330" r="90" fill="url(#dotsCream)"/>

<!-- sun -->
<circle cx="320" cy="380" r="205" fill="#FFD42A"/>
<g clip-path="url(#sun)"><rect x="100" y="440" width="440" height="170" fill="url(#dotsPink)"/></g>

<!-- notes -->
<g transform="translate(150 415) rotate(-14) scale(.58)">
<use href="#bn" fill="#FF3D7F" transform="translate(11 9)"/>
<use href="#bn" fill="#101A6B"/>
</g>
<g transform="translate(482 410) rotate(10) scale(.48)">
<use href="#qn" fill="#FF3D7F" transform="translate(9 8)"/>
<use href="#qn" fill="#101A6B"/>
</g>
<g transform="translate(596 470) rotate(-8) scale(.34)"><use href="#qn" fill="#FFF1D6"/></g>

<!-- voice arcs above center singer -->
<g fill="none" stroke="#101A6B" stroke-width="8" stroke-linecap="round">
<path d="M276 400 Q320 368 364 400"/>
<path d="M248 372 Q320 316 392 372"/>
</g>

<!-- CHOIR: faceless, tailored silhouettes -->
<!-- E pink, right edge -->
<g transform="translate(572 705) scale(.95 1)" fill="#FF3D7F">
<use href="#body"/><use href="#neck"/>
<g transform="rotate(10 0 -60)"><use href="#head"/><path fill="#101A6B" d="M-40 -118 C-46 -172 50 -170 42 -108 C34 -140 0 -150 -40 -118 Z"/></g>
<path d="M-60 86 C-30 60 30 60 60 86" fill="none" stroke="#101A6B" stroke-width="3"/>
</g>
<!-- A yellow, left edge -->
<g transform="translate(70 700) scale(.95 1)" fill="#FFD42A">
<use href="#body"/><use href="#neck"/>
<g transform="rotate(-12 0 -60)"><use href="#head"/><path fill="#101A6B" d="M-39 -120 C-42 -168 42 -168 39 -120 C30 -146 -30 -146 -39 -120 Z"/><circle cx="0" cy="-176" r="17" fill="#101A6B"/></g>
<path d="M-16 12 L0 92 L16 12" fill="none" stroke="#101A6B" stroke-width="3"/>
</g>
<!-- D navy -->
<g transform="translate(445 660)" fill="#101A6B">
<use href="#body"/><use href="#neck"/>
<g transform="rotate(8 0 -60)"><use href="#head"/><path fill="#FFD42A" d="M-40 -122 C-42 -166 42 -166 40 -122 C20 -140 -20 -140 -40 -122 Z"/></g>
<path d="M-15 12 L-36 96 M15 12 L36 96 M0 40 L0 300" fill="none" stroke="#FFF1D6" stroke-width="3"/>
</g>
<!-- B pink -->
<g transform="translate(195 650)" fill="#FF3D7F">
<use href="#body"/><use href="#neck"/>
<g transform="rotate(-9 0 -60)"><path fill="#101A6B" d="M-42 -120 C-46 -176 46 -176 42 -120 L50 -10 L28 -10 L30 -100 C10 -130 -10 -130 -30 -100 L-28 -10 L-50 -10 Z"/><use href="#head"/><path fill="#101A6B" d="M-40 -122 C-42 -170 42 -170 40 -122 C20 -146 -20 -146 -40 -122 Z"/></g>
<rect x="-18" y="-24" width="36" height="40" rx="12" fill="#101A6B" opacity=".25"/>
<path d="M-62 120 C-20 150 20 150 62 120" fill="none" stroke="#101A6B" stroke-width="3"/>
</g>
<!-- C cream, center, tallest -->
<g transform="translate(320 612) scale(1.06)" fill="#FFF1D6">
<use href="#body"/><use href="#neck"/>
<g transform="rotate(-6 0 -60)"><use href="#head"/><path fill="#101A6B" d="M-52 -110 C-72 -152 -40 -200 0 -192 C40 -200 72 -152 52 -110 C44 -142 -44 -142 -52 -110 Z"/></g>
<path d="M-16 12 L-36 104 L0 156 L36 104 L16 12 M0 156 L0 300" fill="none" stroke="#101A6B" stroke-width="3"/>
</g>

<!-- sparkles -->
<g fill="#FFF1D6">
<path d="M62 86 L72 120 L106 130 L72 140 L62 174 L52 140 L18 130 L52 120 Z"/>
<path d="M566 60 L572 82 L594 88 L572 94 L566 116 L560 94 L538 88 L560 82 Z"/>
</g>
</g>

<rect width="640" height="900" filter="url(#grain)" opacity="0.5" style="mix-blend-mode: multiply"/>
</svg>
<h1>Dorlion Koro</h1>
<div class="badge">2 ve 9 Kasım<br>ücretsiz<br>katılım</div>
</div>
<div class="card">
<p class="lab">Her Pazartesi</p>
<p class="time">18.00 – 20.00</p>
<p class="place">Dario Fo’da</p>
</div>
<div class="btns">
<a class="btn b1" href="https://wa.me/905340559905" target="_blank" rel="noopener">İletişim</a>
<a class="btn b2" href="https://www.instagram.com/dorlionkoro?psln=NzZ1dzZhaDNkYTI1&amp;utm_source=qr" target="_blank" rel="noopener">Instagram</a>
</div>
</div>
</body>
</html>
